<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c4a36">
  <meta name="description" content="El anotador de Truco más lindo: fósforos, malas y buenas, envido y truco. De 2 a 7 jugadores. Funciona sin internet.">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Anotador de Truco</title>
  <style>
    *, *::before, *::after {
      margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    :root {
      --felt:    #0c4a36;  --felt-d:  #06301f;  --felt-l: #0f5d44;
      --wood:    #4a2f1a;  --wood-d:  #2a1809;
      --gold:    #e3b341;  --gold-l:  #f6d97f;  --gold-d: #b8862a;
      --cream:   #f4ead2;  --cream-d: #cdbf9e;
      --red:     #cf4436;  --red-l:   #e8705f;
      --ink:     #20180c;
      --line:    rgba(244,234,210,.14);
    }
    html { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      color:var(--cream);
      min-height:100%; min-height:100vh; overflow-x:hidden;
      background:
        radial-gradient(circle at 50% 0%, #14654a 0%, var(--felt) 42%, var(--felt-d) 100%);
    }
    /* felt weave texture */
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px);
      opacity:.7;
    }
    #app { position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; }

    /* ── SHARED ── */
    .card {
      background:rgba(3,28,19,.45);
      border:1px solid var(--line);
      border-radius:16px; padding:18px; margin-bottom:14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 16px rgba(0,0,0,.22);
      backdrop-filter:blur(2px);
    }
    .card-label {
      font-family:Georgia,serif; font-size:12px; font-weight:700;
      text-transform:uppercase; letter-spacing:2px;
      color:var(--gold); margin-bottom:14px;
      display:flex; align-items:center; gap:8px;
    }
    .card-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

    .btn {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:18px; border:none; border-radius:14px;
      font-family:Georgia,serif; font-size:20px; font-weight:700; cursor:pointer;
      transition:transform .12s,filter .12s; -webkit-appearance:none; letter-spacing:.5px;
    }
    .btn:active { transform:scale(.97); filter:brightness(.94); }
    .btn-gold {
      background:linear-gradient(160deg,var(--gold-l),var(--gold) 55%,var(--gold-d));
      color:var(--ink);
      box-shadow:0 4px 0 var(--gold-d), 0 8px 18px rgba(0,0,0,.35);
    }
    .btn-gold:active { box-shadow:0 2px 0 var(--gold-d), 0 4px 10px rgba(0,0,0,.3); transform:translateY(2px) scale(.99); }
    .btn-outline {
      background:rgba(244,234,210,.06); color:var(--cream);
      border:1.5px solid rgba(244,234,210,.3); font-size:16px; padding:14px;
    }

    .field {
      background:rgba(0,0,0,.28); border:1.5px solid var(--line);
      border-radius:11px; padding:13px 14px;
      color:var(--cream); font-size:17px; outline:none;
      transition:border-color .2s,box-shadow .2s; width:100%; -webkit-appearance:none;
    }
    .field::placeholder { color:rgba(244,234,210,.4); }
    .field:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(227,179,65,.15); }
    input[type=number].field { -moz-appearance:textfield; }
    input[type=number].field::-webkit-inner-spin-button { opacity:1; }

    @keyframes fadeUp {
      from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)}
    }
    .animate { animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both; }

    /* avatar = lacquered chip with initial */
    .avatar {
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; font-style:normal; font-family:Georgia,serif; font-weight:700;
      color:#fff; box-shadow: inset 0 2px 4px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.3), 0 2px 4px rgba(0,0,0,.3);
    }

    /* player chip colors */
    .c0{background:radial-gradient(circle at 35% 30%,#f0c95f,#d39a25)}.t0{color:var(--gold-l)}
    .c1{background:radial-gradient(circle at 35% 30%,#e8705f,#c0392b)}.t1{color:var(--red-l)}
    .c2{background:radial-gradient(circle at 35% 30%,#6fc3ec,#2e86c1)}.t2{color:#7fc8ee}
    .c3{background:radial-gradient(circle at 35% 30%,#5cd0ad,#1f9b78)}.t3{color:#52d3ad}
    .c4{background:radial-gradient(circle at 35% 30%,#d49bf2,#9b59b6)}.t4{color:#cf9bef}
    .c5{background:radial-gradient(circle at 35% 30%,#f5a35a,#dd7d2a)}.t5{color:#f3a85f}
    .c6{background:radial-gradient(circle at 35% 30%,#f088b4,#d6498a)}.t6{color:#f088b4}

    /* ── SETUP ── */
    .setup { padding:18px 16px 36px; position:relative; }
    .logo { text-align:center; padding:24px 0 14px; }
    .logo-suits { display:flex; justify-content:center; gap:6px; margin-bottom:14px; }
    .logo-suits svg { filter:drop-shadow(0 3px 5px rgba(0,0,0,.4)); }
    .logo h1 {
      font-family:Georgia,serif; font-size:34px; font-weight:700; letter-spacing:.5px;
      color:var(--cream); text-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .logo h1 .accent { color:var(--gold); }
    .logo p { color:var(--cream-d); font-size:14px; margin-top:6px; font-style:italic; }

    .count-selector { display:flex; gap:7px; }
    .count-btn {
      flex:1; padding:14px 2px; background:rgba(0,0,0,.25); border:1.5px solid var(--line);
      border-radius:11px; font-family:Georgia,serif; font-size:22px; font-weight:700; color:var(--cream-d);
      cursor:pointer; -webkit-appearance:none; transition:all .15s; text-align:center;
    }
    .count-btn.count-active {
      background:linear-gradient(160deg,var(--gold-l),var(--gold));
      border-color:var(--gold-l); color:var(--ink);
      box-shadow:0 3px 10px rgba(227,179,65,.35);
    }
    .count-btn:active { transform:scale(.92); }
    .mode-hint {
      text-align:center; font-size:13px; color:var(--cream-d); margin-top:12px;
      line-height:1.5; font-style:italic;
    }

    .player-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .player-row .avatar { width:42px; height:42px; font-size:17px; }
    .team-divider {
      font-family:Georgia,serif; font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:1.5px; margin-bottom:12px; padding-top:2px;
      display:flex; align-items:center; gap:8px;
    }
    .td-a { color:var(--gold); } .td-b { color:var(--red-l); }

    .target-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .target-row label { font-size:16px; color:var(--cream); }
    .target-row .field { width:90px; text-align:center; font-family:Georgia,serif; font-size:20px; font-weight:700; }

    /* ── GAME ── */
    .game { display:flex; flex-direction:column; min-height:100vh; }
    .game-header {
      background:linear-gradient(180deg,var(--wood),var(--wood-d));
      padding:14px 16px 16px; position:relative;
      border-bottom:2px solid var(--gold-d);
      box-shadow:0 4px 14px rgba(0,0,0,.4);
    }
    .game-header::after {
      content:''; position:absolute; left:0; right:0; bottom:-2px; height:2px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }
    .game-header-row { display:flex; justify-content:space-between; align-items:center; }
    .gh-title { font-family:Georgia,serif; font-size:20px; font-weight:700; color:var(--gold-l);
      display:flex; align-items:center; gap:8px; }
    .btn-back {
      background:transparent; border:none; color:var(--gold-l); font-size:22px;
      cursor:pointer; padding:4px 8px 4px 0; line-height:1; opacity:.75;
      -webkit-appearance:none; transition:opacity .15s,transform .12s;
    }
    .btn-back:active { opacity:1; transform:scale(.85); }
    .pill {
      background:rgba(0,0,0,.3); border:1px solid rgba(227,179,65,.3); border-radius:20px;
      padding:5px 13px; font-size:13px; font-weight:700; color:var(--cream);
      font-family:Georgia,serif;
    }
    .pill b { color:var(--gold-l); }
    .game-body { flex:1; padding:14px 14px 0; overflow-y:auto; }

    /* ── FÓSFOROS (chalk tally) ── */
    .fosforo { display:block; }
    .fosforo .stroke-on  { stroke:var(--cream); }
    .fosforo .stroke-off { stroke:rgba(244,234,210,.09); }

    /* team mode scoreboard */
    .board-grid { display:flex; gap:12px; }
    .board-col { flex:1; display:flex; flex-direction:column; align-items:center;
      background:rgba(0,0,0,.32); border-radius:14px; padding:14px 8px 12px;
      border:1px solid var(--line); }
    .board-col.bc-a { box-shadow: inset 0 2px 0 var(--gold); }
    .board-col.bc-b { box-shadow: inset 0 2px 0 var(--red); }
    .board-team {
      font-family:Georgia,serif; font-size:15px; font-weight:700; letter-spacing:.5px;
      margin-bottom:2px; text-align:center;
    }
    .bc-a .board-team { color:var(--gold-l); } .bc-b .board-team { color:var(--red-l); }
    .board-members { font-size:11px; color:var(--cream-d); text-align:center; margin-bottom:12px;
      line-height:1.4; min-height:15px; }
    .board-section-label {
      font-family:Georgia,serif; font-size:10px; text-transform:uppercase; letter-spacing:2px;
      color:rgba(244,234,210,.5); margin:6px 0 5px; align-self:flex-start; padding-left:2px;
    }
    .squares-row { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-start; min-height:40px; }
    .board-total {
      font-family:Georgia,serif; font-size:46px; font-weight:700; line-height:1;
      margin-top:12px; text-shadow:0 2px 6px rgba(0,0,0,.4);
    }
    .bc-a .board-total { color:var(--gold-l); } .bc-b .board-total { color:var(--red-l); }
    .board-vs {
      align-self:center; font-family:Georgia,serif; font-style:italic;
      color:var(--cream-d); font-size:14px;
    }

    /* individual scoreboard (rotating) */
    .ind-row { display:flex; align-items:center; gap:11px; margin-bottom:13px; }
    .ind-row:last-child { margin-bottom:0; }
    .ind-row .avatar { width:36px; height:36px; font-size:15px; }
    .ind-sitting { opacity:.4; }
    .ind-info { flex:1; min-width:0; }
    .ind-name { font-size:14px; font-weight:700; margin-bottom:4px; font-family:Georgia,serif;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--cream);
      display:flex; align-items:center; gap:7px; }
    .ind-squares { display:flex; gap:3px; }
    .ind-num { font-family:Georgia,serif; font-size:22px; font-weight:700; min-width:34px; text-align:right; }
    .rest-tag {
      font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      background:rgba(244,234,210,.12); color:var(--cream-d);
      padding:2px 7px; border-radius:20px;
    }

    /* sitting-out selector */
    .sitting-chips { display:flex; flex-wrap:wrap; gap:8px; }
    .player-chip {
      display:flex; align-items:center; gap:7px;
      background:rgba(0,0,0,.25); border:1.5px solid var(--line);
      border-radius:50px; padding:8px 14px 8px 8px;
      font-size:14px; font-weight:700; color:var(--cream-d); font-family:Georgia,serif;
      cursor:pointer; transition:all .15s; -webkit-appearance:none;
    }
    .player-chip .avatar { width:26px; height:26px; font-size:12px; }
    .player-chip.chip-active {
      background:linear-gradient(160deg,rgba(227,179,65,.25),rgba(227,179,65,.12));
      border-color:var(--gold); color:var(--gold-l);
    }
    .player-chip:active { transform:scale(.93); }

    /* teams display (rotating) */
    .teams-grid { display:flex; align-items:stretch; gap:10px; }
    .team-col { flex:1; display:flex; flex-direction:column; gap:8px; }
    .team-header { font-family:Georgia,serif; text-align:center; font-size:13px; font-weight:700;
      text-transform:uppercase; letter-spacing:1px; padding-bottom:4px; }
    .team-a-hdr { color:var(--gold-l); } .team-b-hdr { color:var(--red-l); }
    .vs-col { display:flex; align-items:center; justify-content:center;
      font-family:Georgia,serif; font-style:italic; font-size:15px; color:var(--cream-d); padding-top:26px; }
    .team-card {
      display:flex; align-items:center; gap:9px;
      background:rgba(0,0,0,.25); border-radius:11px; padding:11px 10px;
      font-size:15px; font-weight:600; color:var(--cream); width:100%; font-family:Georgia,serif;
    }
    .team-card.team-a { border-left:3px solid var(--gold); }
    .team-card.team-b { border-left:3px solid var(--red); }
    .team-card .avatar { width:30px; height:30px; font-size:13px; }

    /* score inputs + steppers */
    .score-entry { display:flex; align-items:flex-start; gap:10px; }
    .score-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; }
    .se-label { font-family:Georgia,serif; font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:1.5px; }
    .se-a { color:var(--gold-l); } .se-b { color:var(--red-l); }
    .big-input {
      width:100%; background:rgba(0,0,0,.3); border:2px solid var(--line);
      border-radius:13px; padding:14px 6px; color:var(--cream);
      font-family:Georgia,serif; font-size:34px; font-weight:700; text-align:center; outline:none;
      transition:border-color .2s,box-shadow .2s; -webkit-appearance:none; -moz-appearance:textfield;
    }
    .big-input.ia:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(227,179,65,.15); }
    .big-input.ib:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(207,68,54,.15); }
    .big-input::-webkit-inner-spin-button { opacity:1; }
    .steppers { display:flex; gap:6px; width:100%; }
    .step-btn {
      flex:1; padding:9px 0; border-radius:9px; border:1.5px solid var(--line);
      background:rgba(0,0,0,.2); color:var(--cream); font-family:Georgia,serif;
      font-size:15px; font-weight:700; cursor:pointer; -webkit-appearance:none; transition:all .12s;
    }
    .step-a:active { background:rgba(227,179,65,.25); border-color:var(--gold); transform:scale(.92); }
    .step-b:active { background:rgba(207,68,54,.25); border-color:var(--red); transform:scale(.92); }
    .score-vs { font-family:Georgia,serif; font-style:italic; font-size:18px; color:var(--cream-d);
      flex-shrink:0; padding-top:32px; }

    /* history */
    .hist-toggle { display:flex; justify-content:space-between; align-items:center;
      cursor:pointer; user-select:none; }
    .hist-toggle .ht-label { font-family:Georgia,serif; font-size:13px; color:var(--gold); letter-spacing:1px; }
    .hist-toggle .ht-arrow { color:var(--cream-d); font-size:13px; }
    .hist-table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; font-family:Georgia,serif; }
    .hist-table th { color:var(--cream-d); font-weight:700; padding:6px 3px; text-align:center;
      border-bottom:1px solid var(--line); }
    .hist-table th:first-child { text-align:left; }
    .hist-table td { padding:6px 3px; text-align:center; border-bottom:1px solid var(--line); color:var(--cream); }
    .hist-table td:first-child { text-align:left; color:var(--cream-d); }
    .td-win  { color:var(--gold-l); font-weight:700; }
    .td-rest { opacity:.35; }

    .game-footer { padding:14px; position:sticky; bottom:0;
      background:linear-gradient(0deg,var(--felt-d) 70%,transparent);
    }

    /* ── WINNER ── */
    .winner { display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh; padding:28px 18px; text-align:center; position:relative; overflow:hidden; }
    .winner-crown { margin-bottom:6px; }
    .trophy { font-size:78px; display:block; margin-bottom:10px;
      animation:bounce .9s ease infinite alternate; filter:drop-shadow(0 6px 12px rgba(0,0,0,.4)); }
    @keyframes bounce { from{transform:translateY(0) scale(1)} to{transform:translateY(-14px) scale(1.04)} }
    .winner-label { font-family:Georgia,serif; font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:3px; color:var(--gold); margin-bottom:8px; }
    .winner-name { font-family:Georgia,serif; font-size:38px; font-weight:700; line-height:1.1;
      margin-bottom:8px; color:var(--cream); text-shadow:0 3px 10px rgba(0,0,0,.45); }
    .winner-sub { color:var(--cream-d); font-size:14px; margin-bottom:24px; font-style:italic; }
    .final-list { width:100%; }
    .final-row { display:flex; align-items:center; gap:12px; padding:13px 4px;
      border-bottom:1px solid var(--line); }
    .final-row:last-child { border-bottom:none; }
    .final-row .avatar { width:34px; height:34px; font-size:14px; }
    .final-rank { font-family:Georgia,serif; font-size:20px; min-width:30px; color:var(--gold-l); }
    .final-name { flex:1; font-family:Georgia,serif; font-size:16px; font-weight:700; text-align:left; color:var(--cream); }
    .final-team-tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; display:block; }
    .final-pts { font-family:Georgia,serif; font-size:22px; font-weight:700; }

    /* confetti */
    .confetti-wrap { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .dot { position:absolute; top:-12px; animation:fall linear infinite; }
    @keyframes fall { to{transform:translateY(112vh) rotate(720deg);opacity:0} }

    .hidden { display:none !important; }
    .watermark { position:absolute; opacity:.04; pointer-events:none; z-index:0; }

    /* cantos panel */
    .cantos-toggle {
      display:flex; align-items:center; justify-content:space-between;
      width:100%; background:transparent; border:none;
      border-top:1px solid var(--line);
      padding:13px 0 0; margin-top:14px;
      color:var(--gold); font-family:Georgia,serif; font-size:12px;
      font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      cursor:pointer; -webkit-appearance:none;
    }
    .cantos-panel { margin-top:10px; }
    .cantos-group-label {
      font-family:Georgia,serif; font-size:10px; text-transform:uppercase;
      letter-spacing:2px; color:rgba(244,234,210,.45); margin:10px 0 5px; padding-left:1px;
    }
    .canto-row {
      display:flex; align-items:center; gap:8px; padding:5px 1px;
      border-bottom:1px solid rgba(244,234,210,.06);
    }
    .canto-row:last-child { border-bottom:none; }
    .canto-name { flex:1; font-size:13px; color:var(--cream); font-family:Georgia,serif; }
    .canto-btns { display:flex; gap:5px; }
    .canto-btn {
      padding:7px 10px; border-radius:8px; font-size:12px; font-weight:700;
      font-family:Georgia,serif; cursor:pointer; -webkit-appearance:none;
      min-width:52px; text-align:center; border:1.5px solid;
      transition:transform .1s,background .1s;
    }
    .canto-btn:active { transform:scale(.9); }
    .canto-btn-a { background:rgba(227,179,65,.14); border-color:rgba(227,179,65,.38); color:var(--gold-l); }
    .canto-btn-a:active { background:rgba(227,179,65,.3); }
    .canto-btn-b { background:rgba(207,68,54,.14); border-color:rgba(207,68,54,.38); color:var(--red-l); }
    .canto-btn-b:active { background:rgba(207,68,54,.3); }
  </style>
</head>
<body>
<div id="app"></div>
<script>
/* ── SUIT ICONS (naipe español) ── */
function suit(name, size, color) {
  size = size || 26; color = color || 'currentColor';
  var inner = '';
  if (name==='oro')    inner = '<circle cx="50" cy="50" r="40" fill="none" stroke="'+color+'" stroke-width="7"/><circle cx="50" cy="50" r="19" fill="none" stroke="'+color+'" stroke-width="6"/><circle cx="50" cy="50" r="3" fill="'+color+'"/>';
  if (name==='copa')   inner = '<path d="M28 20 H72 Q72 53 50 58 Q28 53 28 20 Z" fill="'+color+'"/><rect x="45" y="57" width="10" height="20" rx="2" fill="'+color+'"/><rect x="33" y="78" width="34" height="8" rx="4" fill="'+color+'"/>';

/* ── PERSISTENCE ──
   Keeps the current game (or setup) alive across refreshes, app closes and
   device restarts — essential at the card table where the app is backgrounded
   constantly. We save the whole state on every render and restore it on boot. */
var STORAGE_KEY = 'anotador-truco-v1';
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return null;
    /* merge over defaults so new fields added in future versions never break a
       game saved by an older build */
    return Object.assign({}, DEFAULT_STATE, saved);
  } catch (e) { return null; }
}

/* ── MODE ── */
function isRotating() { return S.numPlayers % 2 === 1; }
function modeHint(n) {
  if (n===2) return 'Mano a mano · 1 contra 1 · puntaje por equipo';
  if (n===3) return 'Rotativo 1 vs 1 · uno descansa · puntaje individual';
  if (n===4) return 'Clásico · 2 contra 2 · puntaje por equipo';
  if (n===5) return 'Rotativo 2 vs 2 · uno descansa · puntaje individual';
  if (n===6) return '3 contra 3 · puntaje por equipo';
  if (n===7) return 'Rotativo 3 vs 3 · uno descansa · puntaje individual';
  return '';
}
function computeTeams(sittingOut) {
  var n = S.numPlayers, rem = [];
  for (var k=0;k<n-1;k++) rem.push((sittingOut+1+k)%n);
  var a=[], b=[];
  for (var j=0;j<rem.length;j++) { (j%2===0?a:b).push(rem[j]); }
  return { teamA:a, teamB:b };
}
function initial(name, fallback) {
  var t = (name||'').trim();
  return t ? t.charAt(0).toUpperCase() : String(fallback);
}

/* ── FÓSFOROS RENDERER ── */
/* one chalk square showing `strokes` of 5 (4 sides + diagonal) */
function fosforoSquare(strokes, size) {
  size = size || 40;
  var a = size*0.13, b = size*0.87;
  var segs = [
    'M'+a+' '+a+' L'+b+' '+a,   // top
    'M'+b+' '+a+' L'+b+' '+b,   // right
    'M'+b+' '+b+' L'+a+' '+b,   // bottom
    'M'+a+' '+b+' L'+a+' '+a,   // left
    'M'+a+' '+a+' L'+b+' '+b    // diagonal
  ];
  var p = '';
  for (var i=0;i<5;i++) {
    p += '<path d="'+segs[i]+'" class="'+(i<strokes?'stroke-on':'stroke-off')
       + '" stroke-width="'+(size*0.07)+'" stroke-linecap="round" fill="none"/>';
  }
  return '<svg class="fosforo" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+p+'</svg>';
}
/* row of squares for `points` over `nSquares` squares */
function squaresRow(points, nSquares, size) {
  var out = '';
  for (var s=0;s<nSquares;s++) {
    var k = Math.max(0, Math.min(5, points - s*5));
    out += fosforoSquare(k, size);
  }
  return out;
}
function splitSquares() {
  var total = Math.ceil(S.target/5);
  var malas = Math.ceil(total/2);
  return { total:total, malasSquares:malas, malasMax:malas*5, buenasSquares:total-malas };
}

/* team mode: fósforos board */
function tplScoreboardTeam() {
  return '<div class="card animate">'
    + '<div class="card-label">'+suit('oro',14,'#e3b341')+' El tanteador</div>'
    + '<div class="board-grid">'
    + boardColumn('Oro', S.teamAMembers, S.teamScores[0], 'a')
    + boardColumn('Copa', S.teamBMembers, S.teamScores[1], 'b')
    + '</div>'
    + '</div>';
}
function boardColumn(team, members, score, side) {
  var sp = splitSquares();
  var malasPts = Math.min(score, sp.malasMax);
  var buenasPts = Math.max(0, score - sp.malasMax);
  var mem = members.map(function(i){ return esc(firstName(S.players[i].name)); }).join(' · ');
  return '<div class="board-col bc-'+side+'">'
    + '<div class="board-team">Equipo '+team+'</div>'
    + '<div class="board-members">'+mem+'</div>'
    + '<div class="board-section-label">Malas</div>'
    + '<div class="squares-row">'+squaresRow(malasPts, sp.malasSquares, 38)+'</div>'
    + '<div class="board-section-label">Buenas</div>'
    + '<div class="squares-row">'+squaresRow(buenasPts, sp.buenasSquares, 38)+'</div>'
    + '<div class="board-total">'+score+'</div>'
    + '</div>';
}

function tplHistory() {
  if (S.history.length===0) return '';
  var inner = '';

    var ths = S.players.map(function(p){ return '<th>'+esc(firstName(p.name))+'</th>'; }).join('');
    var trs = S.history.map(function(h){
      var tds = S.players.map(function(_,i){
        if (i===h.sittingOut) return '<td class="td-rest">·</td>';
        var inA = h.teamA.indexOf(i)>=0;
        var pts = inA ? h.ptsA : h.ptsB;
        var isWin = pts===Math.max(h.ptsA,h.ptsB) && h.ptsA!==h.ptsB;
        return '<td class="'+(isWin?'td-win':'')+'">'+pts+'</td>';
      }).join('');
      return '<tr><td>'+h.round+'ª</td>'+tds+'</tr>';
    }).join('');
    inner = '<table class="hist-table"><thead><tr><th></th>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table>';
  } else {
    var trs = S.history.map(function(h){
      var winA=h.ptsA>h.ptsB, winB=h.ptsB>h.ptsA;
      return '<tr><td>'+h.round+'ª</td>'
        + '<td class="'+(winA?'td-win':'')+'">'+h.ptsA+'</td>'
        + '<td class="'+(winB?'td-win':'')+'">'+h.ptsB+'</td></tr>';
    }).join('');
    inner = '<table class="hist-table"><thead><tr><th></th><th>Oro</th><th>Copa</th></tr></thead><tbody>'+trs+'</tbody></table>';

/* ── BIND ── */
function on(id, fn) { var el=q(id); if(el) el.addEventListener('click',fn); }
function bindInput(id, key) { var el=q(id); if(el) el.addEventListener('input', function(){ S[key]=el.value; }); }
function bind() {
  on('btn-start', startGame);
  on('btn-round', submitRound);
  on('btn-again', playAgain);
  on('btn-menu',  goToMenu);
  on('btn-hist',  function(){ S.showHist=!S.showHist; render(); });
  [2,3,4,5,6,7].forEach(function(c){ on('cnt-'+c, function(){ setNumPlayers(c); }); });
  if (isRotating()) {
    for (var i=0;i<S.numPlayers;i++) {
      (function(idx){ on('sit-'+idx, function(){ setSittingOut(idx); }); })(i);
    }
  }
  bindInput('ptsA','ptsA'); bindInput('ptsB','ptsB');
  [1,2,3].forEach(function(v){
    on('addA'+v, function(){ addPts('ptsA', v); });
    on('addB'+v, function(){ addPts('ptsB', v); });
  });
  on('btn-cantos', function(){ S.showCantos = !S.showCantos; render(); });
  for (var ci=0; ci<CANTOS.length; ci++) {
    (function(c){
      on('ca-'+c.id, function(){ addPts('ptsA', c.pts); });
      on('cb-'+c.id, function(){ addPts('ptsB', c.pts); });
    })(CANTOS[ci]);
  }
}
function addPts(key, v) {
  var cur = parseInt(S[key])||0;
  S[key] = String(cur+v);
  var el = q(key); if(el) el.value = S[key];
}

/* ── ACTIONS ── */
function setNumPlayers(n) {
  var cur=[];
  for (var i=0;i<S.numPlayers;i++) { var el=q('pn'+i); cur[i]=el?el.value:(S.playerNames[i]||''); }
  S = Object.assign({}, S, { numPlayers:n, playerNames:cur });
  render();
}
function startGame() {
  var n=S.numPlayers, names=[];
  for (var i=0;i<n;i++) names.push((val('pn'+i)||'Jugador '+(i+1)).trim());
  var target = Math.max(5, parseInt(val('tgt'))||30);
  if (isRotating()) {
    var sit0=n-1, t=computeTeams(sit0);
    S = Object.assign({}, S, {
      screen:'game', target,
      players: names.map(function(name){ return {name:name,score:0}; }),
      round:1, sittingOut:sit0, teamA:t.teamA, teamB:t.teamB,
      ptsA:'', ptsB:'', winner:null, history:[], showHist:false, showCantos:false,
    });
  } else {
    var half=n/2, mA=[], mB=[];
    for (var i=0;i<half;i++) mA.push(i);
    for (var i=half;i<n;i++) mB.push(i);
    S = Object.assign({}, S, {
      screen:'game', target,
      players: names.map(function(name){ return {name:name,score:0}; }),
      teamScores:[0,0], teamAMembers:mA, teamBMembers:mB,
      round:1, ptsA:'', ptsB:'', winner:null, history:[], showHist:false, showCantos:false,
    });
  }
  render();
}
function setSittingOut(idx) {
  var t=computeTeams(idx);
  S = Object.assign({}, S, { sittingOut:idx, teamA:t.teamA, teamB:t.teamB, ptsA:'', ptsB:'' });
  render();
}
function submitRound() {
  var ptsA=Math.max(0,parseInt(val('ptsA'))||0);
  var ptsB=Math.max(0,parseInt(val('ptsB'))||0);
  var newHistory = S.history.concat([{ round:S.round, ptsA:ptsA, ptsB:ptsB,
    sittingOut:S.sittingOut, teamA:S.teamA.slice(), teamB:S.teamB.slice() }]);
  if (isRotating()) {
    var np = S.players.map(function(p,i){
      var g = S.teamA.indexOf(i)>=0?ptsA : S.teamB.indexOf(i)>=0?ptsB : 0;
      return { name:p.name, score:p.score+g };
    });
    var mx = Math.max.apply(null, np.map(function(p){ return p.score; }));
    if (mx>=S.target) {
      var wp = np.filter(function(p){return p.score>=S.target;}).sort(function(a,b){return b.score-a.score;})[0];
      S = Object.assign({}, S, { players:np, history:newHistory, winner:wp.name, round:S.round+1, screen:'winner' });
    } else {
      var ns=(S.sittingOut+1)%S.numPlayers, t=computeTeams(ns);
      S = Object.assign({}, S, { players:np, history:newHistory, round:S.round+1, sittingOut:ns, teamA:t.teamA, teamB:t.teamB, ptsA:'', ptsB:'' });
    }
  } else {
    var nts=[S.teamScores[0]+ptsA, S.teamScores[1]+ptsB];
    if (Math.max(nts[0],nts[1])>=S.target) {
      var wi = nts[0]>=nts[1]?0:1;
      var mem = wi===0?S.teamAMembers:S.teamBMembers;
      var wn = 'Equipo '+(wi===0?'Oro':'Copa')+' — '+mem.map(function(i){return firstName(S.players[i].name);}).join(' + ');
      S = Object.assign({}, S, { teamScores:nts, history:newHistory, winner:wn, round:S.round+1, screen:'winner' });
    } else {
      S = Object.assign({}, S, { teamScores:nts, history:newHistory, round:S.round+1, ptsA:'', ptsB:'' });
    }
  }
  render();
}
function goToMenu() {
  if (!confirm('¿Abandonar la partida y volver al menú?')) return;
  S = Object.assign({}, S, {
    screen:'setup', winner:null, round:1, ptsA:'', ptsB:'', history:[], showHist:false, showCantos:false,
    players: S.players.map(function(p){ return {name:p.name,score:0}; }), teamScores:[0,0],
  });
  render();
}
function playAgain() {
  var sit0=S.numPlayers-1;
  if (isRotating()) {
    var t=computeTeams(sit0);
    S = Object.assign({}, S, { screen:'setup',
      players:S.players.map(function(p){return {name:p.name,score:0};}),
      round:1, sittingOut:sit0, teamA:t.teamA, teamB:t.teamB,
      ptsA:'', ptsB:'', winner:null, history:[], showHist:false, showCantos:false });
  } else {
    S = Object.assign({}, S, { screen:'setup',
      players:S.players.map(function(p){return {name:p.name,score:0};}),
      teamScores:[0,0], round:1, ptsA:'', ptsB:'', winner:null, history:[], showHist:false, showCantos:false });
  }
  render();
}

/* ── UTILS ── */
function q(id)   { return document.getElementById(id); }
function val(id) { var el=q(id); return el?el.value:''; }
function firstName(name) { return (name||'').split(' ')[0]; }
function esc(str) { var d=document.createElement('div'); d.appendChild(document.createTextNode(String(str))); return d.innerHTML; }

/* ── OFFLINE / INSTALL ──
   Register the service worker so the app loads with no internet (it's used at
   the card table). Harmless on platforms without SW support. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

render();
</script>
