<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="felt" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#14654a"/>
      <stop offset="46%" stop-color="#0c4a36"/>
      <stop offset="100%" stop-color="#06301f"/>
    </radialGradient>
    <radialGradient id="gold" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f6d97f"/>
      <stop offset="55%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#b8862a"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- full-bleed felt background (maskable-safe) -->
  <rect width="1024" height="1024" fill="url(#felt)"/>

  <!-- subtle gold frame ring -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#e3b341" stroke-opacity="0.16" stroke-width="10"/>

  <!-- the "oro" coin, brand mark -->
  <g filter="url(#sh)">
    <circle cx="512" cy="512" r="300" fill="url(#gold)"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#9a6f22" stroke-width="14"/>
    <circle cx="512" cy="512" r="232" fill="none" stroke="#7d5a1c" stroke-opacity="0.55" stroke-width="14"/>
    <circle cx="512" cy="512" r="150" fill="none" stroke="#7d5a1c" stroke-opacity="0.55" stroke-width="14"/>
    <circle cx="512" cy="512" r="34" fill="#7d5a1c" fill-opacity="0.7"/>
  </g>
</svg>
