<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <defs>
    <radialGradient id="gold" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f6d97f"/>
      <stop offset="55%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#b8862a"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- coin centered, ~60% of canvas so it sits inside the adaptive-icon safe zone -->
  <g filter="url(#sh)" transform="translate(216,216)">
    <circle r="128" fill="url(#gold)"/>
    <circle r="128" fill="none" stroke="#9a6f22" stroke-width="6"/>
    <circle r="99" fill="none" stroke="#7d5a1c" stroke-opacity="0.55" stroke-width="6"/>
    <circle r="64" fill="none" stroke="#7d5a1c" stroke-opacity="0.55" stroke-width="6"/>
    <circle r="15" fill="#7d5a1c" fill-opacity="0.7"/>
  </g>
</svg>
