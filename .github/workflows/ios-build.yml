name: Build iOS

# Compila la app de iOS en una Mac de GitHub (no hace falta tener Mac).
#  - Siempre: un .ipa SIN FIRMAR (para instalar en un iPhone con Sideloadly /
#    AltStore usando tu Apple ID) y un .app para el Simulador.
#  - Si están los secrets de App Store Connect y lo pedís al correr el workflow
#    a mano: firma el build y lo sube a TestFlight / App Store Connect.
#
# Ver CI_RELEASE.md (sección iOS) para configurar los secrets.

on:
  push:
    paths:
      - 'www/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Firmar y subir a TestFlight (requiere los secrets de App Store Connect)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write   # para publicar la IPA como release
    env:
      HAS_ASC_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into iOS project (pod install)
        run: npx cap sync ios

      # ── .app para el Simulador ──
      - name: Build for Simulator
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/dd-sim/Build/Products/Release-iphonesimulator"
          zip -qry "$RUNNER_TEMP/AnotadorDeTruco-simulator.zip" App.app

      - name: Upload Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/AnotadorDeTruco-simulator.zip
          if-no-files-found: error

      # ── .ipa sin firmar para iPhone (sideload) ──
      - name: Build unsigned IPA
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-dev" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd-dev/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/AnotadorDeTruco-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/AnotadorDeTruco-unsigned.ipa
          if-no-files-found: error

      # Igual que el APK: lo publica como release para bajarlo sin iniciar
      # sesión. No se marca como "latest" para no pisar el link fijo del APK.
      - name: Publish unsigned IPA as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}
          name: Anotador de Truco iOS (prueba ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            IPA sin firmar compilada desde `${{ github.ref_name }}` (${{ github.sha }}).
            Para instalarla en un iPhone, abrila con Sideloadly o AltStore desde la
            compu, que la firman con tu Apple ID.
          files: ${{ runner.temp }}/AnotadorDeTruco-unsigned.ipa
          make_latest: false

      # ── Build firmado + subida a TestFlight ──
      # Usa firma automática de Xcode con una API key de App Store Connect
      # (rol Admin): Xcode crea el certificado y el perfil solo.
      - name: Archive, sign and upload to App Store Connect
        if: ${{ env.HAS_ASC_KEY == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight }}
        working-directory: ios/App
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_API_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$APPSTORE_API_KEY_ID"
                -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID")

          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
