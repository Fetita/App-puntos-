name: Deploy to GitHub Pages

# Publica la carpeta www/ (la app) en GitHub Pages.
# Requisito (una sola vez): Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches: [claude/multiplayer-scoring-game-Oj11B]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload www/
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
