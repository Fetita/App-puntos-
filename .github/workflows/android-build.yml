name: Build Android

# Builds the app in the cloud so you don't need Android Studio locally.
#  - Always: a debug APK you can install on a phone to test.
#  - If signing secrets are configured: a signed .aab ready for Google Play.
#
# Run it from the GitHub "Actions" tab (Run workflow) or on every push here.

on:
  push:
    branches: [claude/app-store-playstore-launch-761qdm]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para publicar el APK como release
    env:
      # 'true' only when the keystore secret is present — gates the release steps.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # el default incluye 'tools', que ya no existe en las cmdline-tools
          # actuales y hace fallar al sdkmanager; Gradle baja el resto solo
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publica el APK como release del repo, así se baja directo desde el
      # celular (sin iniciar sesión ni descomprimir) en un link que no cambia:
      # https://github.com/Fetita/App-puntos-/releases/latest/download/anotador-truco.apk
      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk anotador-truco.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Anotador de Truco (prueba ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            APK de prueba compilado desde `${{ github.ref_name }}` (${{ github.sha }}).
            Para instalarlo en Android, bajá `anotador-truco.apk` desde el celular y abrilo.
          files: anotador-truco.apk
          make_latest: true

      # ── Signed release bundle (.aab) for the Play Store ──
      # Only runs when you've added the four repo secrets (see CI_RELEASE.md).
      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/truco-upload.jks"

      - name: Build signed release bundle (.aab)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          TRUCO_KEYSTORE_FILE: ${{ runner.temp }}/truco-upload.jks
          TRUCO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRUCO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRUCO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
